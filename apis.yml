name: Tempo Automation
description: 'Tempo Automation is a San Francisco-based software-automated printed circuit board
  assembly (PCBA) manufacturer, founded in 2013 and formerly publicly traded on Nasdaq as TMPO.
  Its software-driven manufacturing platform was built to take complex electronics from design to
  physical prototype and new product introduction in as little as a few days, serving customers in
  aerospace, medical technology, semiconductor, industrial, and automotive. It was surfaced in the
  API Evangelist network as a portfolio company of Lux Capital and Uncork Capital. The company does
  not publish a public developer API, SDK, or developer portal; its current website is a single-page
  placeholder offering on-demand circuit board manufacturing through a contact form.'
